<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img"><title>One M4 world, two task pipelines</title><rect width="1440" height="560" fill="#f7f6f1"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#68837a" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#182c29"><text x="42" y="57" font-size="30" font-weight="600">One M4 world, two task pipelines</text><text x="42" y="96" font-size="18" fill="#60706a">Frozen objects, geometry and collision proxies → retrieval and planning → dynamics → evaluation</text><text x="44" y="156" font-size="15" fill="#196451" font-weight="700">DRONE</text><rect x="44" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="69" cy="202" r="13" fill="#196451"/><text x="69" y="208" text-anchor="middle" fill="white" font-size="14">1</text><text x="61" y="241" font-size="17">Reference image</text><path d="M297 218 H314" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="318" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="343" cy="202" r="13" fill="#196451"/><text x="343" y="208" text-anchor="middle" fill="white" font-size="14">2</text><text x="335" y="241" font-size="17">M4 view retrieval</text><path d="M571 218 H588" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="592" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="617" cy="202" r="13" fill="#196451"/><text x="617" y="208" text-anchor="middle" fill="white" font-size="14">3</text><text x="609" y="241" font-size="17">Collision-aware route</text><path d="M845 218 H862" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="866" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="891" cy="202" r="13" fill="#196451"/><text x="891" y="208" text-anchor="middle" fill="white" font-size="14">4</text><text x="883" y="241" font-size="17">Quadrotor dynamics</text><path d="M1119 218 H1136" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="1140" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="1165" cy="202" r="13" fill="#196451"/><text x="1165" y="208" text-anchor="middle" fill="white" font-size="14">5</text><text x="1157" y="241" font-size="17">Photo + pose error</text><text x="44" y="314" font-size="15" fill="#196451" font-weight="700">UNITREE G1</text><rect x="44" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="69" cy="360" r="13" fill="#196451"/><text x="69" y="366" text-anchor="middle" fill="white" font-size="14">1</text><text x="61" y="399" font-size="17">Language request</text><path d="M297 376 H314" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="318" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="343" cy="360" r="13" fill="#196451"/><text x="343" y="366" text-anchor="middle" fill="white" font-size="14">2</text><text x="335" y="399" font-size="17">Semantic instance</text><path d="M571 376 H588" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="592" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="617" cy="360" r="13" fill="#196451"/><text x="617" y="366" text-anchor="middle" fill="white" font-size="14">3</text><text x="609" y="399" font-size="17">Reachable approach</text><path d="M845 376 H862" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="866" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="891" cy="360" r="13" fill="#196451"/><text x="891" y="366" text-anchor="middle" fill="white" font-size="14">4</text><text x="883" y="399" font-size="17">G1 walking policy</text><path d="M1119 376 H1136" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="1140" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="1165" cy="360" r="13" fill="#196451"/><text x="1165" y="366" text-anchor="middle" fill="white" font-size="14">5</text><text x="1157" y="399" font-size="17">Arrival + visibility</text><line x1="44" y1="453" x2="1396" y2="453" stroke="#d9dfd7"/><text x="44" y="493" font-size="15" fill="#60706a">Task agents read M4. Drone target truth is reserved for post-execution evaluation. Localization and recognition limits are stated with results.</text></g></svg>