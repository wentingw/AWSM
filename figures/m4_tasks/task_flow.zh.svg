<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img"><title>同一个 M4 世界，两条任务链路</title><rect width="1440" height="560" fill="#f7f6f1"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#68837a" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#182c29"><text x="42" y="57" font-size="30" font-weight="600">同一个 M4 世界，两条任务链路</text><text x="42" y="96" font-size="18" fill="#60706a">冻结的对象、几何与碰撞表示 → 检索和规划 → 物理执行 → 独立验证</text><text x="44" y="156" font-size="15" fill="#196451" font-weight="700">无人机 / DRONE</text><rect x="44" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="69" cy="202" r="13" fill="#196451"/><text x="69" y="208" text-anchor="middle" fill="white" font-size="14">1</text><text x="61" y="241" font-size="17">参考照片</text><path d="M297 218 H314" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="318" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="343" cy="202" r="13" fill="#196451"/><text x="343" y="208" text-anchor="middle" fill="white" font-size="14">2</text><text x="335" y="241" font-size="17">M4 视图检索</text><path d="M571 218 H588" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="592" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="617" cy="202" r="13" fill="#196451"/><text x="617" y="208" text-anchor="middle" fill="white" font-size="14">3</text><text x="609" y="241" font-size="17">航路规划</text><path d="M845 218 H862" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="866" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="891" cy="202" r="13" fill="#196451"/><text x="891" y="208" text-anchor="middle" fill="white" font-size="14">4</text><text x="883" y="241" font-size="17">无人机动力学</text><path d="M1119 218 H1136" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="1140" y="174" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="1165" cy="202" r="13" fill="#196451"/><text x="1165" y="208" text-anchor="middle" fill="white" font-size="14">5</text><text x="1157" y="241" font-size="17">终点图与位姿误差</text><text x="44" y="314" font-size="15" fill="#196451" font-weight="700">宇树 G1 / G1</text><rect x="44" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="69" cy="360" r="13" fill="#196451"/><text x="69" y="366" text-anchor="middle" fill="white" font-size="14">1</text><text x="61" y="399" font-size="17">自然语言指令</text><path d="M297 376 H314" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="318" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="343" cy="360" r="13" fill="#196451"/><text x="343" y="366" text-anchor="middle" fill="white" font-size="14">2</text><text x="335" y="399" font-size="17">语义实例选择</text><path d="M571 376 H588" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="592" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="617" cy="360" r="13" fill="#196451"/><text x="617" y="366" text-anchor="middle" fill="white" font-size="14">3</text><text x="609" y="399" font-size="17">可达目标与路线</text><path d="M845 376 H862" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="866" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="891" cy="360" r="13" fill="#196451"/><text x="891" y="366" text-anchor="middle" fill="white" font-size="14">4</text><text x="883" y="399" font-size="17">G1 行走策略</text><path d="M1119 376 H1136" stroke="#68837a" stroke-width="2" marker-end="url(#a)"/><rect x="1140" y="332" width="250" height="89" rx="8" fill="#fffefa" stroke="#d9dfd7"/><circle cx="1165" cy="360" r="13" fill="#196451"/><text x="1165" y="366" text-anchor="middle" fill="white" font-size="14">5</text><text x="1157" y="399" font-size="17">接近、朝向与可见性</text><line x1="44" y1="453" x2="1396" y2="453" stroke="#d9dfd7"/><text x="44" y="493" font-size="15" fill="#60706a">任务系统只读取 M4；无人机目标真值仅在执行后的评估中使用。自身定位来源、物理近似与识别范围随结果披露。</text></g></svg>