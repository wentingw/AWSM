%YAML:1.0
# Independent stable camera+IMU rig profile (250 Hz IMU, 25 Hz images).
verbosity: "INFO"
use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false
max_clones: 31
max_slam: 80
max_slam_in_update: 30
max_msckf_in_update: 60
dt_slam_delay: 1
gravity_mag: 9.81
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"
try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.08
zupt_noise_multiplier: 10
zupt_max_disparity: 0.1
zupt_only_at_beginning: true
# Use a 2 s static window; ZUPT disables jerk waiting, so initialization occurs at first valid static window.
init_window_time: 2.0
init_imu_thresh: 0.20
init_max_disparity: 2.0
init_max_features: 80
init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 8
init_dyn_min_deg: 8.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]
record_timing_information: false
record_timing_filepath: "/tmp/stable_vio_timing.txt"
save_total_state: false
filepath_est: "/tmp/stable_vio_estimate.txt"
filepath_std: "/tmp/stable_vio_std.txt"
filepath_gt: "/tmp/stable_vio_disabled_truth.txt"
use_klt: true
num_pts: 300
fast_threshold: 15
grid_x: 6
grid_y: 5
min_px_dist: 8
knn_ratio: 0.70
track_frequency: 20.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"
use_aruco: false
num_aruco: 1024
downsize_aruco: true
up_msckf_sigma_px: 1.0
up_msckf_chi2_multipler: 1.0
up_slam_sigma_px: 1.0
up_slam_chi2_multipler: 1.0
up_aruco_sigma_px: 1.0
up_aruco_chi2_multipler: 1.0
use_mask: false
relative_config_imu: "kalibr_imu_smooth.yaml"
relative_config_imucam: "kalibr_imucam_smooth.yaml"
